name: test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  perl-latest:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            architecture: arm64
          - runner: macos-15
            architecture: arm64
          - runner: macos-15-intel
            architecture: x86_64
          - runner: macos-26
            architecture: arm64
          - runner: macos-26-intel
            architecture: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Verify runner architecture
        run: test "$(uname -m)" = "${{ matrix.architecture }}"
      - name: Build zopfli from source
        # Homebrew's zopfli formula is deprecated (upstream google/zopfli is
        # archived) and due to be disabled, so this builds the zopfli-1.0.3
        # tag directly instead of depending on that formula's lifecycle.
        # It's a small, dependency-free C project; Xcode's command line
        # tools are enough. Every byte counts, but not enough to fail the
        # build over: if any of this doesn't work, build-pkg.pl just ships
        # pkgbuild's own gzip, exactly as if this step had never run.
        id: zopfli
        continue-on-error: true
        env:
          ZOPFLI_TARBALL_SHA256: 09a9732e11975455921a7ec22cad75ca42ed3ea4c9cbe3ccff09750a77e03bcb
        run: |
          commit=bd64b2f0553d4f1ef4e6627647c5d9fc8c71ffc0
          archive="$RUNNER_TEMP/zopfli-src.tar.gz"
          curl --fail --location --silent --show-error \
            --output "$archive" \
            "https://github.com/google/zopfli/archive/$commit.tar.gz"
          printf '%s  %s\n' "$ZOPFLI_TARBALL_SHA256" "$archive" | shasum -a 256 --check
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          make -C "$RUNNER_TEMP/zopfli-$commit" zopfli
          mkdir -p "$RUNNER_TEMP/bin"
          cp "$RUNNER_TEMP/zopfli-$commit/zopfli" "$RUNNER_TEMP/bin/zopfli"
          echo "bin=$RUNNER_TEMP/bin/zopfli" >> "$GITHUB_OUTPUT"
      - name: Syntax check
        run: |
          while IFS= read -r file; do
            /usr/bin/perl -Iconditions/lib -c "$file"
          done < <(find conditions tools t -type f \
            \( -name '*.pl' -o -name '*.pm' -o -name '*.t' \) -print)
      - name: Test
        # build-pkg.pl's own test suite (t/package.t) exercises zopfli
        # discovery through PATH directly, which is the documented local-
        # dev behavior; it does not need or use MUNKI_PERLS_ZOPFLI.
        run: /usr/bin/prove -lr t
      - name: Build and inspect package
        env:
          # Passed explicitly rather than adding the built binary to PATH:
          # if the "Build zopfli from source" step above failed, this output
          # is empty, and build-pkg.pl must treat that as "zopfli is not
          # available", not go looking for some other same-named binary
          # that might already be reachable on the runner's PATH.
          MUNKI_PERLS_ZOPFLI: ${{ steps.zopfli.outputs.bin }}
        run: |
          tools/build-pkg.pl --output "$RUNNER_TEMP/munki-perls-0.1.0.pkg"
          /usr/sbin/pkgutil --expand "$RUNNER_TEMP/munki-perls-0.1.0.pkg" "$RUNNER_TEMP/expanded"
          /usr/bin/lsbom "$RUNNER_TEMP/expanded/Bom"

  perl-5-8-6:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            architecture: arm64
            asset: perl-5.8.6-darwin-arm64.tar.zstd
            sha256: 5f6726a5d81bea4f5abe2b94bbda9a094e138c8c8b13f7f0eea4f47bee12464a
          - runner: macos-15
            architecture: arm64
            asset: perl-5.8.6-darwin-arm64.tar.zstd
            sha256: 5f6726a5d81bea4f5abe2b94bbda9a094e138c8c8b13f7f0eea4f47bee12464a
          - runner: macos-15-intel
            architecture: x86_64
            asset: perl-5.8.6-darwin-x64.tar.zstd
            sha256: aa1a6ff32dc159fbd85ebd1a8b382d446250e4c34695b873e46cfdbf2a606520
          - runner: macos-26
            architecture: arm64
            asset: perl-5.8.6-darwin-arm64.tar.zstd
            sha256: 5f6726a5d81bea4f5abe2b94bbda9a094e138c8c8b13f7f0eea4f47bee12464a
          - runner: macos-26-intel
            architecture: x86_64
            asset: perl-5.8.6-darwin-x64.tar.zstd
            sha256: aa1a6ff32dc159fbd85ebd1a8b382d446250e4c34695b873e46cfdbf2a606520
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Verify runner architecture
        run: test "$(uname -m)" = "${{ matrix.architecture }}"
      - name: Install exact Perl 5.8.6
        env:
          ASSET: ${{ matrix.asset }}
          SHA256: ${{ matrix.sha256 }}
        run: |
          tag=perl-5.8.6-20260322131611
          archive="$RUNNER_TEMP/$ASSET"
          curl --fail --location --silent --show-error \
            --output "$archive" \
            "https://github.com/shogo82148/build-perl/releases/download/$tag/$ASSET"
          printf '%s  %s\n' "$SHA256" "$archive" | shasum -a 256 --check
          command -v zstd >/dev/null 2>&1 || brew install zstd
          zstd --decompress --long=30 "$archive" \
            -o "$RUNNER_TEMP/perl-5.8.6.tar"
          mkdir -p "$RUNNER_TEMP/perl-5.8.6" "$RUNNER_TEMP/foundation-stub"
          tar -xf "$RUNNER_TEMP/perl-5.8.6.tar" \
            -C "$RUNNER_TEMP/perl-5.8.6"
          printf 'package Foundation;\nsub import { }\n1;\n' \
            > "$RUNNER_TEMP/foundation-stub/Foundation.pm"
          perl_root="$RUNNER_TEMP/perl-5.8.6"
          perl_lib="$perl_root/lib"
          printf 'PERL586=%s\nPERL5LIB=%s:%s:%s:%s:%s:conditions/lib\n' \
            "$perl_root/bin/perl" \
            "$RUNNER_TEMP/foundation-stub" \
            "$perl_lib/5.8.6/darwin-2level" \
            "$perl_lib/5.8.6" \
            "$perl_lib/site_perl/5.8.6/darwin-2level" \
            "$perl_lib/site_perl/5.8.6" >> "$GITHUB_ENV"
      - name: Verify exact interpreter
        run: test "$($PERL586 -e 'print $]')" = 5.008006
      - name: Compile every Perl source and test
        run: |
          while IFS= read -r file; do
            "$PERL586" -Iconditions/lib -c "$file"
          done < <(find conditions tools t -type f \
            \( -name '*.pl' -o -name '*.pm' -o -name '*.t' \) -print)
      - name: Run Foundation-independent tests
        run: |
          "$PERL586" "$RUNNER_TEMP/perl-5.8.6/bin/prove" -lv \
            t/00-syntax.t t/static-policy.t t/package.t

  perl-5-8-8:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            architecture: arm64
            asset: perl-5.8.8-darwin-arm64.tar.zstd
            sha256: f09dbcef349f0fb22e1a6aac84f38623359a42e763eacf519ac3f0a8d7a759d3
          - runner: macos-15
            architecture: arm64
            asset: perl-5.8.8-darwin-arm64.tar.zstd
            sha256: f09dbcef349f0fb22e1a6aac84f38623359a42e763eacf519ac3f0a8d7a759d3
          - runner: macos-15-intel
            architecture: x86_64
            asset: perl-5.8.8-darwin-x64.tar.zstd
            sha256: d2394adb9b67a504da6a05690f3df405aae638d6d41b8d30c703773a3ee3bb0e
          - runner: macos-26
            architecture: arm64
            asset: perl-5.8.8-darwin-arm64.tar.zstd
            sha256: f09dbcef349f0fb22e1a6aac84f38623359a42e763eacf519ac3f0a8d7a759d3
          - runner: macos-26-intel
            architecture: x86_64
            asset: perl-5.8.8-darwin-x64.tar.zstd
            sha256: d2394adb9b67a504da6a05690f3df405aae638d6d41b8d30c703773a3ee3bb0e
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Verify runner architecture
        run: test "$(uname -m)" = "${{ matrix.architecture }}"
      - name: Install exact Perl 5.8.8
        env:
          ASSET: ${{ matrix.asset }}
          SHA256: ${{ matrix.sha256 }}
        run: |
          tag=perl-5.8.8-20260321094406
          archive="$RUNNER_TEMP/$ASSET"
          curl --fail --location --silent --show-error \
            --output "$archive" \
            "https://github.com/shogo82148/build-perl/releases/download/$tag/$ASSET"
          printf '%s  %s\n' "$SHA256" "$archive" | shasum -a 256 --check
          command -v zstd >/dev/null 2>&1 || brew install zstd
          zstd --decompress --long=30 "$archive" \
            -o "$RUNNER_TEMP/perl-5.8.8.tar"
          mkdir -p "$RUNNER_TEMP/perl-5.8.8" "$RUNNER_TEMP/foundation-stub"
          tar -xf "$RUNNER_TEMP/perl-5.8.8.tar" \
            -C "$RUNNER_TEMP/perl-5.8.8"
          printf 'package Foundation;\nsub import { }\n1;\n' \
            > "$RUNNER_TEMP/foundation-stub/Foundation.pm"
          perl_root="$RUNNER_TEMP/perl-5.8.8"
          perl_lib="$perl_root/lib"
          printf 'PERL588=%s\nPERL5LIB=%s:%s:%s:%s:%s:conditions/lib\n' \
            "$perl_root/bin/perl" \
            "$RUNNER_TEMP/foundation-stub" \
            "$perl_lib/5.8.8/darwin-2level" \
            "$perl_lib/5.8.8" \
            "$perl_lib/site_perl/5.8.8/darwin-2level" \
            "$perl_lib/site_perl/5.8.8" >> "$GITHUB_ENV"
      - name: Verify exact interpreter
        run: test "$($PERL588 -e 'print $]')" = 5.008008
      - name: Compile every Perl source and test
        run: |
          while IFS= read -r file; do
            "$PERL588" -Iconditions/lib -c "$file"
          done < <(find conditions tools t -type f \
            \( -name '*.pl' -o -name '*.pm' -o -name '*.t' \) -print)
      - name: Run Foundation-independent tests
        run: |
          "$PERL588" "$RUNNER_TEMP/perl-5.8.8/bin/prove" -lv \
            t/00-syntax.t t/static-policy.t t/package.t

  release:
    needs: [perl-latest, perl-5-8-6, perl-5-8-8]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Choose release version
        id: release
        run: |
          version="0.1.${GITHUB_RUN_NUMBER}"
          printf 'version=%s\ntag=v%s\npackage=%s/munki-perls-%s.pkg\n' \
            "$version" "$version" "$RUNNER_TEMP" "$version" >> "$GITHUB_OUTPUT"
      - name: Build zopfli from source
        # See the perl-latest job for why this builds from a pinned source
        # commit instead of relying on Homebrew's deprecated formula.
        id: zopfli
        continue-on-error: true
        env:
          ZOPFLI_TARBALL_SHA256: 09a9732e11975455921a7ec22cad75ca42ed3ea4c9cbe3ccff09750a77e03bcb
        run: |
          commit=bd64b2f0553d4f1ef4e6627647c5d9fc8c71ffc0
          archive="$RUNNER_TEMP/zopfli-src.tar.gz"
          curl --fail --location --silent --show-error \
            --output "$archive" \
            "https://github.com/google/zopfli/archive/$commit.tar.gz"
          printf '%s  %s\n' "$ZOPFLI_TARBALL_SHA256" "$archive" | shasum -a 256 --check
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          make -C "$RUNNER_TEMP/zopfli-$commit" zopfli
          mkdir -p "$RUNNER_TEMP/bin"
          cp "$RUNNER_TEMP/zopfli-$commit/zopfli" "$RUNNER_TEMP/bin/zopfli"
          echo "bin=$RUNNER_TEMP/bin/zopfli" >> "$GITHUB_OUTPUT"
      - name: Import package signing certificate
        env:
          INSTALLER_CERTIFICATE_P12: ${{ secrets.INSTALLER_CERTIFICATE_P12 }}
          INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.INSTALLER_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/package-signing.keychain-db"
          keychain_password="$(uuidgen)"
          certificate="$RUNNER_TEMP/installer-certificate.p12"
          printf '%s' "$INSTALLER_CERTIFICATE_P12" | base64 --decode > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" \
            -k "$keychain" \
            -P "$INSTALLER_CERTIFICATE_PASSWORD" \
            -T /usr/bin/pkgbuild \
            -T /usr/bin/productsign
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$keychain_password" \
            "$keychain"
          security list-keychains -d user -s "$keychain"
          rm -f "$certificate"
      - name: Build release package
        env:
          # See the perl-latest job: passed explicitly rather than via
          # PATH, so a failed zopfli build can't be silently substituted
          # with some other same-named binary already on the runner.
          MUNKI_PERLS_ZOPFLI: ${{ steps.zopfli.outputs.bin }}
        run: |
          tools/build-pkg.pl \
            --version "${{ steps.release.outputs.version }}" \
            --sign "Developer ID Installer: Wesley Whetstone (2D8XQ77EBQ)" \
            --output "${{ steps.release.outputs.package }}"
      - name: Verify release package signature
        run: |
          signature="$(pkgutil --check-signature "${{ steps.release.outputs.package }}")"
          printf '%s\n' "$signature"
          grep -Fq \
            "Developer ID Installer: Wesley Whetstone (2D8XQ77EBQ)" \
            <<< "$signature"
      - name: Remove package signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/package-signing.keychain-db"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE: ${{ steps.release.outputs.package }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$PACKAGE" --clobber
          else
            gh release create "$TAG" "$PACKAGE" \
              --target "$GITHUB_SHA" \
              --title "munki-perls $RELEASE_VERSION" \
              --generate-notes
          fi
